# Categories for auto-generated release notes (labels come from PRs; Dependabot
# adds "dependencies").
changelog:
  exclude:
    authors: []
  categories:
    - title: "⚠️ Breaking changes"
      labels: [breaking-change]
    - title: "🔒 Security"
      labels: [security]
    - title: "✨ Features"
      labels: [enhancement, feature]
    - title: "🐛 Fixes"
      labels: [bug, fix]
    - title: "📚 Documentation"
      labels: [docs, documentation]
    - title: "⬆️ Dependencies"
      labels: [dependencies]
    - title: "Other changes"
      labels: ["*"]
