# Dependabot version updates. Security updates are enabled in repo settings
# and open PRs for vulnerable dependencies immediately, regardless of schedule.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, go]
    groups:
      azure-sdk:
        patterns: ["github.com/Azure/*"]
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, frontend]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "react-router-dom"]
      build-tooling:
        patterns: ["vite", "@vitejs/*", "typescript", "tailwindcss", "@tailwindcss/*"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, infra]
    groups:
      terraform-providers:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    labels: [dependencies, docs]
