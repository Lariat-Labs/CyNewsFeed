# Releases are one versioned bundle: the cynews binary (with the UI embedded)
# and its Docker image share a single SemVer tag.
#
# Cut a release either by:
#   - Actions → Release → Run workflow (choose patch / minor / major), or
#   - pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            LAST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
            LAST=${LAST:-v0.0.0}
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            case "$BUMP" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              *)     PA=$((PA+1)) ;;
            esac
            TAG="v${MA}.${MI}.${PA}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    name: Binaries
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build UI
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Cross-compile
        working-directory: backend
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="cynews_${TAG}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "build/$name/cynews$ext" ./cmd/cynews
            cp ../README.md ../.env.example "build/$name/"
            if [ "$os" = windows ]; then (cd build && zip -qr "../../dist/$name.zip" "$name"); else tar -C build -czf "../dist/$name.tar.gz" "$name"; fi
          done
          cd ../dist && sha256sum * > checksums.txt && cat checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/*

  image:
    name: Docker image (GHCR)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cynewsfeed
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [version, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/cynewsfeed:${TAG}"
          cat > notes-header.md <<NOTES
          ## Install

          **Docker**
          \`\`\`bash
          docker pull ${IMAGE}
          \`\`\`

          **Binary**: download the archive for your platform below, verify it against \`checksums.txt\`, then run \`./cynews serve\`.

          **Azure**: \`make deploy\` (builds from source in ACR). See the [deployment docs](https://lariat-labs.github.io/CyNewsFeed/deployment/).

          NOTES
          gh release create "$TAG" dist/* \
            --title "CyNewsFeed $TAG" \
            --notes-file notes-header.md \
            --generate-notes \
            --verify-tag
