site_name: CyNewsFeed
site_description: Cybersecurity news & podcast aggregator with AI briefings, alert rules, detections, IOC sharing and a research agent.
site_url: https://lariat-labs.github.io/CyNewsFeed/
repo_url: https://github.com/Lariat-Labs/CyNewsFeed
repo_name: Lariat-Labs/CyNewsFeed
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Deployment (Azure): deployment.md
  - Configuration: configuration.md
  - User guide:
      - Feed & AI summaries: user-guide/feed.md
      - Alert rules: user-guide/alert-rules.md
      - Research agent: user-guide/agent.md
      - Detections & IOCs: user-guide/detections-iocs.md
      - AI security: user-guide/ai-security.md
      - Events, trends & briefs: user-guide/events-briefs.md
  - Integrations:
      - Slack: integrations/slack.md
      - TAXII 2.1 (Sentinel, OpenCTI, MISP, Splunk): integrations/taxii.md
      - MCP server: integrations/mcp.md
      - MISP push: integrations/misp.md
  - Reference:
      - REST API: reference/api.md
      - CLI: reference/cli.md
      - AI costs: reference/costs.md
      - Architecture: architecture.md
      - Design notes: design.md
  - Development: development.md
